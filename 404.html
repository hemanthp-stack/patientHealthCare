<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Pulse Shield — Redirecting...</title>
    <link rel="icon" type="image/png" href="pulse_shield_logo.png">
    <script>
        (function() {
            var pathname = window.location.pathname;
            var origin = window.location.origin;
            var search = window.location.search;
            
            // Base path: e.g. '/healthtech' on github.io, or ''
            var repoBase = origin.includes('github.io') ? (pathname.split('/')[1] ? '/' + pathname.split('/')[1] : '') : '';
            
            if (pathname.includes('emergency')) {
                // Extract health ID from URL path if passed like /emergency/AH-2026-8849-IN
                var match = pathname.match(/emergency\/([A-Za-z0-9\-_]+)/);
                var params = new URLSearchParams(search);
                if (match && match[1] && !match[1].endsWith('.html') && !params.get('id')) {
                    params.set('id', match[1]);
                }
                var queryStr = params.toString() ? '?' + params.toString() : '';
                window.location.replace(origin + repoBase + '/emergency.html' + queryStr);
            } else {
                window.location.replace(origin + repoBase + '/index.html' + search);
            }
        })();
    </script>
</head>
<body style="background:#020617;color:#fff;font-family:sans-serif;text-align:center;padding:60px 20px;">
    <div style="margin-bottom:16px;"><img src="pulse_shield_logo.png" alt="Pulse Shield" style="width:48px;height:48px;display:inline-block;"></div>
    <h2>Redirecting to Pulse Shield...</h2>
    <p><a href="index.html" style="color:#6366f1;">Click here if you are not redirected automatically</a></p>
</body>
</html>
